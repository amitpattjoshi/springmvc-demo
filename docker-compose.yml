services:
  postgres:
    image: postgres:latest
    container_name: local_pgdb
    restart: always
    ports:
        - "5433:5432"
    environment:
      POSTGRES_DB: amitdb
      POSTGRES_USER: dockeruser
      POSTGRES_PASSWORD: dockerpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockeruser -d amitdb"]
      interval: 1s
networks:
    demo-network:
      driver: bridge

volumes:
    local_pgdata:

